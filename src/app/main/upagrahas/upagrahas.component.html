<div class="app-card mt-2">
    <div class="pb-2">
        <div class="app-form-header mb-2">
            <div>
                <h3 class="app-section-title">Upagraha Placements</h3>
                <p class="text-sm text-text-secondary mt-1">
                    Select the Rashi for each Upagraha
                </p>
            </div>
            <p-button
                label="Reset Form"
                severity="secondary"
                [outlined]="true"
                (onClick)="resetForm()"
            />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-4">
            @for (field of placementFields; track field.key) {
                <div>
                    <label
                        class="app-label after:content-['*'] after:ml-1 after:text-red-500"
                    >
                        {{ field.label }}
                    </label>
                    <p-select
                        class="w-full"
                        [options]="signs()"
                        [ngModel]="upagrahaForm().placements[field.key]"
                        (ngModelChange)="updateUpagrahaPlacement(field.key, $event)"
                        optionLabel="label"
                        optionValue="value"
                        placeholder="Select Rashi"
                    ></p-select>
                </div>
            }
        </div>

        <div class="app-action-row">
            <p-button
                [styleClass]="isFormValid() ? 'active:scale-95 transition-all' : 'opacity-70'"
                (onClick)="callApi()"
                [disabled]="!isFormValid()"
                label="Submit"
            ></p-button>
        </div>
    </div>
</div>
@if (allEffects().length > 0) {
    <div class="app-card mt-4" #effectsContainer>
        <h4 class="app-section-title">Upagraha effects obtained</h4>
        <div class="app-table-wrap">
            <p-table [value]="allEffects()" showGridlines>
                <ng-template #header>
                    <tr>
                        <th>Upagraha</th>
                        <th>Effects</th>
                    </tr>
                </ng-template>
                <ng-template #body let-item>
                    <tr>
                        <td>{{ item.upagraha }}</td>
                        <td>
                            <ul class="list-disc m-2">
                                @for (itemEffects of item.effects; track $index) {
                                    <li>{{ itemEffects }}</li>
                                }
                            </ul>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
}
<p-toast position="bottom-right" key="br"></p-toast>
